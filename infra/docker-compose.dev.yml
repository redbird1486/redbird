version: '3.8'

services:
  api:
    build:
      context: ../api
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - ../api:/app/api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:13
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=storageconnect

  redis:
    image: redis:6
    ports:
      - "6379:6379"

volumes:
  postgres-data:
